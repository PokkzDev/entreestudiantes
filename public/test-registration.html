<!DOCTYPE html>
<html>
<head>
    <title>Test Registration API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        button { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .result { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test Registration API</h1>
    <p>This page tests if the registration API properly returns JSON responses.</p>
    
    <button onclick="testWithInvalidDomain()">Test with Invalid Domain (gmail.com)</button>
    <button onclick="testWithValidDomain()">Test with Valid Domain (inacapmail.cl)</button>
    
    <div id="result"></div>

    <script>
        async function testAPI(email, testName) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="result">Testing ${testName}...</div>`;
            
            try {
                console.log(`Testing ${testName} with email: ${email}`);
                
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email }),
                });

                console.log('Response status:', response.status);
                console.log('Response headers:', Object.fromEntries(response.headers.entries()));

                const responseText = await response.text();
                console.log('Response body:', responseText);

                // Try to parse as JSON
                try {
                    const jsonData = JSON.parse(responseText);
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ ${testName} - Valid JSON Response</h3>
                            <p><strong>Status:</strong> ${response.status}</p>
                            <p><strong>Message:</strong> ${jsonData.message}</p>
                            <pre>${JSON.stringify(jsonData, null, 2)}</pre>
                        </div>
                    `;
                } catch (parseError) {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ ${testName} - Invalid JSON Response</h3>
                            <p><strong>Status:</strong> ${response.status}</p>
                            <p><strong>Parse Error:</strong> ${parseError.message}</p>
                            <p><strong>Response starts with:</strong> ${responseText.substring(0, 100)}</p>
                            <details>
                                <summary>Full Response</summary>
                                <pre>${responseText}</pre>
                            </details>
                        </div>
                    `;
                }

            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ ${testName} - Network Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
                console.error('Error testing API:', error);
            }
        }

        function testWithInvalidDomain() {
            testAPI('test@gmail.com', 'Invalid Domain Test');
        }

        function testWithValidDomain() {
            testAPI('test@inacapmail.cl', 'Valid Domain Test');
        }
    </script>
</body>
</html>
